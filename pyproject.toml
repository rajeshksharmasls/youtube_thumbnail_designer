[project]
name = "youtube-thumbnail-designer"
version = "0.1.0"
description = "YouTube Thumbnail Designer (LangGraph reflexion agent)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.0",
    "langchain-openai>=1.0",
    "langchain-core>=1.0",
    "openai>=2.0",
    "tavily-python>=0.7",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ytb_thumb_design_agent*"]

